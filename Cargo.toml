[package]
name = "cloudpulse"
version = "0.1.0"
edition = "2024"
authors = ["adamsolit"]
description = "High-performance native Linux desktop client for SoundCloud built with GTK4 and Libadwaita"
license = "MIT"
readme = "README.md"
repository = "https://github.com/adamsolit/soundcloud-in-rust"
homepage = "https://github.com/adamsolit/soundcloud-in-rust"
keywords = ["soundcloud", "audio", "streaming", "gtk4", "wayland"]
categories = ["multimedia::audio"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
fastrand = "2.5.0"
futures-util = "0.3.34"
gdk4 = "0.11.5"
glib = "0.22.10"
gstreamer = "0.25.4"
gstreamer-audio = "0.25.4"
gstreamer-player = "0.25.0"
gtk4 = { version = "0.11.5", features = ["v4_12"] }
keyring = "4.2.0"
libadwaita = { version = "0.9.2", features = ["v1_5"] }
mpris-server = "0.11.0"
parking_lot = "0.13.0"
reqwest = { version = "0.13.5", features = ["json", "cookies", "multipart", "stream"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
urlencoding = "2.1.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
